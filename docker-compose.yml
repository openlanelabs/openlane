name: openlane

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openlane
      POSTGRES_PASSWORD: openlane # local only — override for anything real
      POSTGRES_DB: openlane
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # creates the openlane_app login the migrations grant privileges to
      # (ADR-0002: the app role is the RLS trust boundary)
      - ./infra/docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openlane"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: infra/docker/migrate.Dockerfile
    environment:
      # owner DSN: migrations run as the table owner (bypasses RLS for DDL — intended)
      DATABASE_URL: postgres://openlane:openlane@postgres:5432/openlane?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  vaults3:
    image: eniz1806/vaults3:latest
    environment:
      VAULTS3_ACCESS_KEY: openlane
      VAULTS3_SECRET_KEY: openlane-secret # local only
      VAULTS3_DATA_DIR: /data
      VAULTS3_METADATA_DIR: /metadata
    ports:
      - "9000:9000"
    volumes:
      - s3data:/data
      - s3meta:/metadata

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      # ADR-0002: the app connects as the NON-OWNER role — RLS applies.
      # Owner connections are migration-only (see the migrate service).
      DATABASE_URL: postgres://openlane_app:openlane_app@postgres:5432/openlane?sslmode=disable
      OPENLANE_S3_ENDPOINT: http://vaults3:9000
      OPENLANE_S3_KEY: openlane
      OPENLANE_S3_SECRET: openlane-secret
      OPENLANE_S3_BUCKET: openlane-files
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    environment:
      # ADR-0002: worker runs as the app role — RLS applies; the SF
      # processor sets workspace ctx per job from the job's own args.
      DATABASE_URL: postgres://openlane_app:openlane_app@postgres:5432/openlane?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Open Nitro MCP server (stdio). Run per-workspace:
  #   docker compose run -e OPENLANE_MCP_WORKSPACE=<uuid> mcp
  # and pipe JSON-RPC over stdin/stdout to your MCP client.
  mcp:
    build:
      context: .
      dockerfile: infra/docker/mcp.Dockerfile
    environment:
      DATABASE_URL: postgres://openlane_app:openlane_app@postgres:5432/openlane?sslmode=disable
    profiles: ["nitro"]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      OPENLANE_API_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  s3data:
  s3meta:

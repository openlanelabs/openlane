            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeEntry"
        "400": { $ref: "#/components/responses/BadRequest" }
  /me/time:
    get:
      summary: The caller's time entries (all projects)
      operationId: listMyTime
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: "Entries (default range: last 7 days)"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeEntry"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /automations:
    post:
      summary: Create an automation rule (unlimited runs)
      description: >
        P0 triggers: the events the API emits (task.completed,
        approval.requested/decided, csat.submitted, project.created*).
        P0 actions: slack_message (workspace webhook) and create_task.
        Condition: optional project_id filter.
      operationId: createAutomation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, trigger_event, action]
              properties:
                name:
                  type: string
                trigger_event:
                  type: string
                  enum: [task.completed, approval.requested, approval.decided,
                         csat.submitted, project.created, project.created_from_template]
                condition:
                  type: object
                  properties:
                    project_id:
                      type: string
                      format: uuid
                action:
                  oneOf:
                    - type: object
                      required: [type]
                      properties:
                        type:
                          type: string
                          enum: [slack_message]
                    - type: object
                      required: [type, project_id, title]
                      properties:
                        type:
                          type: string
                          enum: [create_task]
                        project_id:
                          type: string
                          format: uuid
                        title:
                          type: string
                        customer_visible:
                          type: boolean
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      summary: List automation rules
      operationId: listAutomations
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Automation"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /automations/{id}:
    patch:
      summary: Toggle a rule active/inactive
      operationId: patchAutomation
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_active]
              properties:
                is_active:
                  type: boolean
      responses:
        "200": {description: Updated}
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Soft-delete a rule
      operationId: deleteAutomation
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204": {description: Deleted}
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /automations/{id}/runs:
    get:
      summary: Run history (unlimited, §408)
      operationId: listAutomationRuns
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Runs (latest 100)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    event:
                      type: string
                    event_ref:
                      type: string
                    status:
                      type: string
                      enum: [completed, failed, skipped]
                    detail:
                      type: string
                    created_at:
                      type: string
        "401": { $ref: "#/components/responses/Unauthorized" }
  /tasks/{id}/messages:
    post:
      summary: Staff — post a message on a task thread (chat-lite)
      description: >
        Author = the JWT user. @email and @uuid mentions are extracted
        server-side and stored. 30 msgs/min/author (§276 spam edge).
      operationId: createTaskMessage
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        "201":
          description: Posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskMessage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { description: Rate-limited (Retry-After) }
    get:
      summary: Staff — read the task thread
      description: >
        ?after_id= returns messages strictly after that message
        (created_at,id ordering). Polling shape until the WS hub (§449).
      operationId: listTaskMessages
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: after_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Thread (max 200)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskMessage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /portal/{token}/tasks/{task_id}/messages:
    post:
      summary: Portal — customer replies on a shared task
      description: >
        Only customer_visible tasks in the link's projects; internal
        tasks 404 (no oracle). Author = the link's contact.
      operationId: portalPostTaskMessage
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 43
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        "201":
          description: Posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskMessage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { description: Rate-limited }
    get:
      summary: Portal — read the shared task's thread
      operationId: portalListTaskMessages
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 43
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: after_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Thread
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskMessage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { description: Link expired or revoked }
  /search:
    get:
      summary: Global search (projects, tasks, docs, files)
      description: >
        Trigram similarity (typo-tolerant) + substring fallback for
        short queries; ranked by score, recency tiebreak. Permission
        filtering is RLS — every branch of the UNION runs under the
        caller's tenant + visibility policies (§207 never leak
        internal).
      operationId: staffSearch
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "200":
          description: Hits (max 60)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchHit"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /portal/{token}/search:
    get:
      summary: Portal search — customer-visible rows only
      description: >
        Same engine scoped by the portal link: shared projects,
        customer_visible tasks/docs/files. Internal rows are never
        candidates — RLS again, not application filtering.
      operationId: portalSearch
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 43
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "200":
          description: Hits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchHit"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "410": { description: Link expired or revoked }
  /integrations/hubspot:
    put:
      summary: Configure HubSpot one-way integration
      operationId: putHubspotSettings
      description: |
        Same shape as Salesforce: webhook secret encrypted at rest
        (AES-256-GCM). SF and HubSpot settings coexist per workspace
        (workspace_integrations PK is (workspace_id, provider)).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [webhook_secret]
              properties:
                instance_url:
                  type: string
                webhook_secret:
                  type: string
                  minLength: 16
                default_template_id:
                  type: string
                  format: uuid
      responses:
        "204": {description: Saved}
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      summary: HubSpot integration status (secret never echoed)
      operationId: getHubspotSettings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Configured state
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured:
                    type: boolean
                  instance_url:
                    type: string
                  default_template_id:
                    type: string
                  updated_at:
                    type: string
        "401": { $ref: "#/components/responses/Unauthorized" }
  /integrations/hubspot/webhook:
    post:
      summary: HubSpot closed-won Deal webhook (HMAC-verified)
      description: >
        Unauthenticated but HMAC-SHA256-signed over the raw body
        (X-OpenLane-Signature, base64). Workspace resolved by ?ws=slug
        via SECURITY DEFINER. dealstage closedwon only; dedupe by
        (hubspot, hs:portalId:dealId) + job enqueue in one tx.
      operationId: hubspotWebhook
      security: []
      parameters:
        - name: ws
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                portalId:
                  type: string
                dealId:
                  type: string
                dealName:
                  type: string
                properties:
                  type: object
                  properties:
                    dealstage:
                      type: string
                    amount:
                      type: string
                    closedate:
                      type: string
      responses:
        "200":
          description: ignored | duplicate | queued
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /integrations/salesforce:
    put:
      summary: Configure Salesforce one-way integration
      operationId: putSalesforceSettings
      description: |
        Stores the webhook secret encrypted at rest (AES-256-GCM,
        OPENLANE_INTEGRATION_KEY). One-way only (spec section 335):
        OpenLane never writes to Salesforce in v1.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [webhook_secret]
              properties:
                instance_url:
                  type: string
                webhook_secret:
                  type: string
                  minLength: 16
                default_template_id:
                  type: string
                  format: uuid
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      summary: Salesforce integration status (never echoes the secret)
      operationId: getSalesforceSettings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured:
                    type: boolean
                  instance_url:
                    type: string
                  default_template_id:
                    type: string
                    format: uuid
                  updated_at:
                    type: string
        "401": { $ref: "#/components/responses/Unauthorized" }
  /integrations/salesforce/webhook:
    post:
      summary: Salesforce closed-won webhook (HMAC-verified, unauthenticated)
      operationId: salesforceWebhook
      description: |
        Machine-to-machine: HMAC-SHA256 over the raw body in the
        X-OpenLane-Signature header (base64). A closed-won Opportunity
        (stageName == "Closed Won") dedupes by (organizationId,
        opportunityId) and enqueues project creation transactionally —
        duplicate deliveries and API crashes cannot double-create or
        lose a project (outbox, ADR-0003).
      parameters:
        - name: ws
          in: query
          required: true
          description: Workspace slug
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                organizationId:
                  type: string
                opportunityId:
                  type: string
                accountName:
                  type: string
                amount:
                  type: string
                closeDate:
                  type: string
                stageName:
                  type: string
      responses:
        "200":
          description: "Accepted (status: queued | duplicate | ignored)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [queued, duplicate, ignored]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/approvals:
    post:
      summary: Request an approval from the customer
      operationId: createApproval
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                description:
                  type: string
      responses:
        "201":
          description: Created (pending)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      summary: List project approvals (staff, any status)
      operationId: listProjectApprovals
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Approvals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Approval"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /portal/{token}/csat:
    post:
      summary: Portal — 1-click CSAT rating (§7.4, §14)
      description: >
        One response per approval, asked right after the customer decides.
        Score 1-5 (😞 to 😄) + optional comment. Undecided, foreign, or
        already-rated approvals all 404 — no oracle. Score <3 auto-opens
        an escalation task for the team (deduped per project).
      operationId: submitPortalCSAT
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 43
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approval_id, score]
              properties:
                approval_id:
                  type: string
                  format: uuid
                score:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
                  maxLength: 2000
      responses:
        "201":
          description: Rating recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  score:
                    type: integer
                  emoji:
                    type: string
                  escalated:
                    type: boolean
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/forms:
    post:
      summary: Staff — create a form (required fields enforced at submit)
      operationId: createForm
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, fields]
              properties:
                title:
                  type: string
                description:
                  type: string
                published:
                  type: boolean
                fields:
                  type: array
                  items:
                    $ref: "#/components/schemas/FormFields"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Form"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      summary: Staff — list project forms
      operationId: listProjectForms
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Forms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Form"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /forms/{id}/responses.csv:
    get:
      summary: Staff — export responses as CSV (§9)
      operationId: exportFormResponsesCSV
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: CSV — one row per response, columns per field key
          content:
            text/csv:
              schema:
                type: string
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /portal/{token}/forms:
    get:
      summary: Portal — published forms to fill
      operationId: listPortalForms
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 43
      responses:
        "200":
          description: Published forms (fields to render)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    title:
                      type: string
                    description:
                      type: string
                    fields:
                      type: array
                      items:
                        $ref: "#/components/schemas/FormFields"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "410": { description: Link expired or revoked }
  /portal/{token}/forms/{id}/submit:
    post:
      summary: Portal — submit a form response (once per contact)
      description: >
        Required fields are enforced server-side: a missing required
        field 400s naming the field. Unknown keys are stripped, date
        fields must be YYYY-MM-DD. Resubmitting or a foreign form id
        both 404 — no oracle.
      operationId: submitPortalForm
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 43
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "201":
          description: Submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/docs:
    post:
      summary: Staff — create a project doc (version 1)
      operationId: createDoc
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 255
                content_md:
                  type: string
                customer_visible:
                  type: boolean
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Doc"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      summary: Staff — list project docs (latest metadata)
      operationId: listProjectDocs
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Docs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Doc"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /docs/{id}:
    get:
      summary: Staff — current doc with latest content
      operationId: getDoc
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Doc with content
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Doc"
                  - type: object
                    properties:
                      content_md:
                        type: string
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Staff — edit a doc (appends a version, never overwrites)
      operationId: updateDoc
      description: >
        Any subset of title/content_md/customer_visible. Appends a
        doc_versions row and bumps latest_version; content carries
        forward on title-only edits (spec §9: version history).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 255
                content_md:
                  type: string
                customer_visible:
                  type: boolean
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Doc"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /docs/{id}/versions:
    get:
      summary: Staff — version history (descending)
      operationId: listDocVersions
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Versions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    version:
                      type: integer
                    content_md:
                      type: string
                    created_by:
                      type: string
                    created_at:
                      type: string
        "401": { $ref: "#/components/responses/Unauthorized" }
  /portal/{token}/docs:
    get:
      summary: Portal — customer-visible docs (latest content only)
      operationId: listPortalDocs
      description: >
        Customer sees ONLY what staff mark customer_visible (§7.3) —
        the same visibility line as tasks and files. Select-only.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 43
      responses:
        "200":
          description: Docs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    title:
                      type: string
                    content_md:
                      type: string
                    updated_at:
                      type: string
        "401": { $ref: "#/components/responses/Unauthorized" }
        "410": { description: Link expired or revoked }
  /projects/{id}/csat:
    get:
      summary: Staff — CSAT responses, average, response rate, trend (§14)
      description: >
        Response rate = responses / decided approvals — survivorship bias
        guard (§14 edge). Trend = last 5 responses, chronological.
      operationId: listProjectCSAT
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: CSAT stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  responses:
                    type: array
                    items:
                      $ref: "#/components/schemas/CSATResponse"
                  average_score:
                    type: number
                    description: null when no responses yet
                    example: 4.3
                  response_rate:
                    type: number
                    example: 0.75
        "401": { $ref: "#/components/responses/Unauthorized" }
  /approvals/{id}/reopen:
    post:
      summary: Reopen a decided approval (new round)
      operationId: reopenApproval
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204": {description: Reopened}
        "404": { $ref: "#/components/responses/NotFound" }
  /portal/{token}/approvals:
    get:
      summary: Portal — pending approvals for the linked projects
      operationId: listPortalApprovals
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 43
      responses:
        "200":
          description: "Pending only — decided approvals vanish (1-click UX)"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    project_id:
                      type: string
                      format: uuid
                    title:
                      type: string
                    description:
                      type: string
        "401": { $ref: "#/components/responses/Unauthorized" }
        "410": { description: Link expired or revoked }
  /portal/{token}/approvals/{id}/decide:
    post:
      summary: Portal — Approve / Request changes with comment
      operationId: decidePortalApproval
      description: >
        Pending-only: probes of decided or out-of-scope approvals both 404
        (no oracle). Decisions write audit rows attributed to the contact.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 43
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approved, changes_requested]
                comment:
                  type: string
      responses:
        "200":
          description: Decided
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [approved, changes_requested]
                  id:
                    type: string
                    format: uuid
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /settings/slack:
    put:
      summary: Configure the workspace Slack webhook
      description: >
        Allowlisted to hooks.slack.com and *.slack.com/services/ URLs only —
        arbitrary hosts are rejected (SSRF guard, spec §17-5). Delivery is
        best-effort fire-and-forget on enabled events.
      operationId: putSlackSettings
      security:
        - bearerAuth: []
      parameters:
        - name: X-Workspace-Id
          in: header
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [webhook_url]
              properties:
                webhook_url: {type: string, format: uri}
                notify_task_completed: {type: boolean, default: true}
                notify_project_created: {type: boolean, default: true}
      responses:
        "204": {description: Saved}
        "400":
          description: URL not on the Slack allowlist
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
    get:
      summary: Slack settings status
      operationId: getSlackSettings
      security:
        - bearerAuth: []
      parameters:
        - name: X-Workspace-Id
          in: header
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Status (URL itself is never echoed back)
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured: {type: boolean}
                  notify_task_completed: {type: boolean}
                  notify_project_created: {type: boolean}
    delete:
      summary: Clear the Slack webhook
      operationId: deleteSlackSettings
      security:
        - bearerAuth: []
      parameters:
        - name: X-Workspace-Id
          in: header
          required: true
          schema: {type: string, format: uuid}
      responses:
        "204": {description: Cleared}
  /rate-cards:
    post:
      summary: Create a rate card (P1 §320)
      operationId: createRateCard
      security:
        - bearerAuth: []
      parameters:
        - name: X-Workspace-Id
          in: header
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RateCardIn"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RateCard"}
        "400": {description: Validation}
    get:
      summary: List rate cards (rates aggregated)
      operationId: listRateCards
      security:
        - bearerAuth: []
      parameters:
        - name: X-Workspace-Id
          in: header
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Cards
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/RateCard"}
  /rate-cards/{id}:
    get:
      summary: Get one rate card with rates
      operationId: getRateCard
      security:
        - bearerAuth: []
      parameters:
        - name: X-Workspace-Id
          in: header
          required: true
          schema: {type: string, format: uuid}
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Card
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RateCard"}
        "404": {description: Not found}
    patch:
      summary: Activate/deactivate (rates are immutable — §326)
      operationId: patchRateCard
      security:
        - bearerAuth: []
      parameters:
        - name: X-Workspace-Id
          in: header
          required: true
          schema: {type: string, format: uuid}
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_active]
              properties:
                is_active: {type: boolean}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RateCard"}
    delete:
      summary: Soft-delete a rate card
      operationId: deleteRateCard
      security:
        - bearerAuth: []
      parameters:
        - name: X-Workspace-Id
          in: header
          required: true
          schema: {type: string, format: uuid}
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "204": {description: Deleted}
        "404": {description: Not found}
  /v1/metrics:
    get:
      summary: Workspace acceptance metrics — TTV, portal open rate, p95 latency
      operationId: getMetrics
      security:
        - bearerAuth: []
      parameters:
        - name: X-Workspace-Id
          in: header
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Metrics rollup
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Metrics"}
components:
  parameters:
    IdPathParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PortalTokenPathParam:
      name: token
      in: path
      required: true
      schema:
        type: string
        minLength: 43
        maxLength: 128
  responses:
    BadRequest:
      description: Malformed request (RFC 9457 problem+json)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing, invalid, expired, or revoked credentials
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource does not exist or is outside the caller's scope (no oracle)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Gone:
      description: Portal link revoked or expired
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    File:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
        status:
          type: string
          enum: [pending, uploaded, failed]
        customer_visible:
          type: boolean
        created_at:
          type: string
          format: date-time
        upload_url:
          type: string
          description: presigned PUT — create response only
        url:
          type: string
          description: presigned GET — /url responses only
    TaskMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        author_type:
          type: string
          enum: [user, contact]
        author_id:
          type: string
        author_name:
          type: string
        body:
          type: string
        mentions:
          type: array
          items:
            type: string
        created_at:
          type: string
    Automation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        trigger_event:
          type: string
        condition:
          type: object
        action:
          type: object
        is_active:
          type: boolean
        created_at:
          type: string
    SearchHit:
      type: object
      properties:
        type:
          type: string
          enum: [project, task, doc, file]
        id:
          type: string
          format: uuid
        title:
          type: string
        project_id:
          type: string
          format: uuid
        score:
          type: number
    Form:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FormFields"
        published:
          type: boolean
    FormFields:
      type: object
      required: [key, type]
      properties:
        key:
          type: string
          description: snake_case answer key
        label:
          type: string
        type:
          type: string
          enum: [text, date, file]
        required:
          type: boolean
    Doc:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        title:
          type: string
        customer_visible:
          type: boolean
        latest_version:
          type: integer
        updated_at:
          type: string
    CSATResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        approval_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        score:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
        emoji:
          type: string
        created_at:
          type: string
    Approval:
      type: object
      properties:
        id:
          type: string
          format: uuid
    RateCardIn:
      type: object
      required: [name, rates]
      properties:
        customer_id:
          type: [string, "null"]
          format: uuid
        name: {type: string}
        currency: {type: string, description: 3-letter ISO code}
        effective_from: {type: string, format: date}
        rates:
          type: array
          minItems: 1
          items:
            type: object
            required: [role, hourly_rate]
            properties:
              role: {type: string}
              hourly_rate: {type: number}
    RateCard:
      type: object
      properties:
        id: {type: string, format: uuid}
        customer_id:
          type: [string, "null"]
          format: uuid
        name: {type: string}
        currency: {type: string}
        is_active: {type: boolean}
        effective_from: {type: string, format: date}
        rates:
          type: array
          items:
            type: object
            properties:
              role: {type: string}
              hourly_rate: {type: number}
        created_at: {type: string}
    Metrics:
      type: object
      description: P0 acceptance metrics (§588) — TTV, portal open rate, latency
      properties:
        ttv:
          type: object
          properties:
            count: {type: integer}
            avg_days: {type: number}
            min_days: {type: number}
            max_days: {type: number}
        portal_open_rate:
          type: object
          properties:
            active_links: {type: integer}
            opened: {type: integer}
            rate: {type: number}
        api_latency:
          type: object
          properties:
            p50_ms: {type: number}
            p95_ms: {type: number}
            p99_ms: {type: number}
            requests: {type: integer, format: int64}
            errors: {type: integer, format: int64}
        project_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [pending, approved, changes_requested]
        decision_comment:
          type: string
        decided_at:
          type: string
        created_at:
          type: string
    TimeEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        minutes:
          type: integer
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        note:
          type: string
        status:
          type: string
          enum: [draft, submitted, approved, rejected]
    SessionTokens:
      type: object
      properties:
        access_token: {type: string, description: "JWT, 15 min"}
        refresh_token: {type: string, minLength: 43}
        token_type: {type: string, const: Bearer}
        user_id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        role: {type: string}
    Me:
      type: object
      properties:
        user_id: {type: string, format: uuid}
        email: {type: string, format: email}
        display_name: {type: string}
        workspace_id: {type: string, format: uuid}
        workspace_name: {type: string}
        role: {type: string}
    TaskInput:
      type: object
      properties:
        title: {type: string, minLength: 1, maxLength: 255}
        description_md: {type: string}
        owner_type: {type: string, enum: [internal, customer, partner, agent]}
        status: {type: string, enum: [todo, in_progress, blocked, review, done, waived]}
        due_at: {type: [string, "null"], format: date-time}
        required: {type: boolean}
        customer_visible: {type: boolean}
    StaffTask:
      allOf:
        - $ref: "#/components/schemas/TaskInput"
        - type: object
          properties:
            id: {type: string, format: uuid}
            project_id: {type: string, format: uuid}
            completed_at: {type: [string, "null"], format: date-time}
            created_at: {type: string, format: date-time}
    Project:
      type: object
      properties:
        id: {type: string, format: uuid}
        customer_id: {type: string, format: uuid}
        name: {type: string}
        status: {type: string}
        health: {type: string}
        start_date: {type: [string, "null"], format: date}
        target_go_live: {type: [string, "null"], format: date}
        progress_pct: {type: integer, description: Computed — done+waived / total tasks}
        created_at: {type: string, format: date-time}
    Budget:
      type: object
      properties:
        budget_hours: {type: [integer, "null"], description: "null = unbudgeted"}
        billing_type: {type: string, enum: [tm, fixed, retainer]}
        logged_minutes: {type: integer}
        logged_hours: {type: number}
        pct: {type: [number, "null"], description: "null when unbudgeted"}
        status: {type: string, enum: [unbudgeted, ok, warn50, warn80, over]}
    TemplateInput:
      type: object
      required: [name, category, phases]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        category: {type: string, enum: [onboarding, migration, implementation, support]}
        phases:
          type: array
          items:
            type: object
            required: [name, tasks]
            properties:
              name: {type: string}
              tasks:
                type: array
                items:
                  type: object
                  required: [title]
                  properties:
                    title: {type: string, minLength: 1, maxLength: 255}
                    owner_role: {type: string}
                    due_offset_days: {type: integer, minimum: 0}
                    required: {type: boolean, default: true}
                    customer_visible: {type: boolean, default: false}
    Template:
      allOf:
        - $ref: "#/components/schemas/TemplateInput"
        - type: object
          properties:
            id: {type: string, format: uuid}
            version: {type: string}
            is_active: {type: boolean}
            usage_count: {type: integer}
            created_at: {type: string, format: date-time}
    ImportResult:
      type: object
      properties:
        dry_run:
          type: boolean
        source:
          type: string
        project_id:
          type:
            - string
            - "null"
          format: uuid
        ok_count:
          type: integer
        errors:
          type: array
          items:
            type: object
            properties:
              source_row:
                type: integer
              reason:
                type: string
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          description: RFC 9457 problem type URI
          examples: [https://openlane.dev/errors/portal-token-expired]
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    PortalLink:
      type: object
      required: [id, project_id, contact_id, status, expires_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        contact_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, revoked, expired]
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time
    PortalSession:
      type: object
      required: [project_id, project_name, customer_name, contact_id, contact_name, expires_at]
      properties:
        project_id:
          type: string
          format: uuid
        project_name:
          type: string
        customer_name:
          type: string
        contact_id:
          type: string
          format: uuid
        contact_name:
          type: string
        expires_at:
          type: string
          format: date-time
    PortalTask:
      type: object
      required: [id, project_id, title, status, customer_visible, due_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          enum: [todo, in_progress, blocked, review, done, waived]
        customer_visible:
          type: boolean
        due_at:
          type:
            - string
            - "null"
          format: date-time
        completed_at:
          type:
            - string
            - "null"
          format: date-time
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    portalToken:
      type: apiKey
      in: query
      name: portal_token
security:
  - bearerAuth: []

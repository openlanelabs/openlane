openapi: 3.1.0
info:
  title: OpenLane API
  version: 0.1.0
  description: >
    The OpenLane public API — source of truth (ADR-0005).
    Every UI action hits this API. Versioned under /v1; breaking changes need /v2.
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.txt
servers:
  - url: http://localhost:8080/v1
    description: local
paths:
  /portal-links:
    post:
      summary: Create a portal link for a project contact
      description: >
        Internal (staff) only. Generates a 32-byte random token; the DB stores
        only its SHA-256 hash. Token is returned exactly once at creation.
      operationId: createPortalLink
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, contact_id]
              properties:
                project_id:
                  type: string
                  format: uuid
                contact_id:
                  type: string
                  format: uuid
                expires_in_days:
                  type: integer
                  minimum: 1
                  maximum: 30
                  default: 7
      responses:
        "201":
          description: Portal link created; token shown exactly once
          content:
            application/json:
              schema:
                type: object
                required: [id, project_id, contact_id, token, expires_at]
                properties:
                  id:
                    type: string
                    format: uuid
                  project_id:
                    type: string
                    format: uuid
                  contact_id:
                    type: string
                    format: uuid
                  token:
                    type: string
                    description: Raw token — shown exactly once, never stored
                  expires_at:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      summary: List portal links for a project
      operationId: listPortalLinks
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Portal links (never includes raw tokens)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortalLink"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /portal-links/{id}/revoke:
    post:
      summary: Revoke a portal link
      description: Revocation is immediate; the token stops working on the next request.
      operationId: revokePortalLink
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /portal/{token}/session:
    get:
      summary: Resolve a portal session
      description: >
        Validates the portal token, returns workspace/project/customer context
        and the contact it belongs to. RLS scope for everything else flows from here.
      operationId: getPortalSession
      security:
        - portalToken: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 43
            maxLength: 128
      responses:
        "200":
          description: Active session for this token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "410":
          $ref: "#/components/responses/Gone"
  /portal/{token}/tasks:
    get:
      summary: List customer-visible tasks for the portal session
      description: >
        RLS already restricts to the token's project and customer_visible=true
        rows; the handler is a plain SELECT. EC-PORTAL-07 defense lives in the DB.
      operationId: listPortalTasks
      security:
        - portalToken: []
      parameters:
        - $ref: "#/components/parameters/PortalTokenPathParam"
      responses:
        "200":
          description: Customer-visible tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortalTask"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "410":
          $ref: "#/components/responses/Gone"
  /portal/{token}/tasks/{task_id}/complete:
    post:
      summary: Mark a customer-visible task complete
      description: >
        Sets status=done + completed_at. RLS permits only customer_visible tasks
        in the token's project; internal tasks return 404 (not 403 — no oracle).
      operationId: completePortalTask
      security:
        - portalToken: []
      parameters:
        - $ref: "#/components/parameters/PortalTokenPathParam"
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Task completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalTask"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
  /healthz:
    get:
      summary: Liveness probe
      operationId: getHealth
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]

  /v1/imports:
    post:
      summary: Import tasks from a competitor CSV (dry-run or commit)
      description: |
        Parses an Asana/Rocketlane/generic CSV export into OpenLane tasks.
        With dry_run=true nothing is written; the response is the full
        per-row validation report. Without it, valid rows are inserted in
        one transaction and invalid rows are quarantined in the response.
      operationId: createImport
      security:
        - bearerAuth: []
      parameters:
        - name: dry_run
          in: query
          schema:
            type: boolean
            default: false
        - name: X-Workspace-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, source]
              properties:
                file:
                  type: string
                  format: binary
                source:
                  type: string
                  enum: [asana, rocketlane, generic]
                project_id:
                  type: string
                  format: uuid
                  description: Existing project to import into (required unless create_project given).
                create_project:
                  type: object
                  properties:
                    customer_id:
                      type: string
                      format: uuid
                    name:
                      type: string
                      minLength: 3
                      maxLength: 120
                  required: [customer_id, name]
      responses:
        "200":
          description: Validation report (dry run) or import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          description: Bad request (unknown source, missing file, no project target)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Target project not found (or out of workspace scope)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  parameters:
    IdPathParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PortalTokenPathParam:
      name: token
      in: path
      required: true
      schema:
        type: string
        minLength: 43
        maxLength: 128
  responses:
    BadRequest:
      description: Malformed request (RFC 9457 problem+json)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing, invalid, expired, or revoked credentials
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource does not exist or is outside the caller's scope (no oracle)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Gone:
      description: Portal link revoked or expired
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    ImportResult:
      type: object
      properties:
        dry_run:
          type: boolean
        source:
          type: string
        project_id:
          type:
            - string
            - "null"
          format: uuid
        ok_count:
          type: integer
        errors:
          type: array
          items:
            type: object
            properties:
              source_row:
                type: integer
              reason:
                type: string
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          description: RFC 9457 problem type URI
          examples: [https://openlane.dev/errors/portal-token-expired]
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    PortalLink:
      type: object
      required: [id, project_id, contact_id, status, expires_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        contact_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, revoked, expired]
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time
    PortalSession:
      type: object
      required: [project_id, project_name, customer_name, contact_id, contact_name, expires_at]
      properties:
        project_id:
          type: string
          format: uuid
        project_name:
          type: string
        customer_name:
          type: string
        contact_id:
          type: string
          format: uuid
        contact_name:
          type: string
        expires_at:
          type: string
          format: date-time
    PortalTask:
      type: object
      required: [id, project_id, title, status, customer_visible, due_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          enum: [todo, in_progress, blocked, review, done, waived]
        customer_visible:
          type: boolean
        due_at:
          type:
            - string
            - "null"
          format: date-time
        completed_at:
          type:
            - string
            - "null"
          format: date-time
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    portalToken:
      type: apiKey
      in: query
      name: portal_token
security:
  - bearerAuth: []

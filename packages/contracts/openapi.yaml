                  $ref: "#/components/schemas/File"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "410": { $ref: "#/components/responses/Gone" }
  /portal/{token}/files/{file_id}/url:
    get:
      summary: Portal — presigned GET for a visible file
      operationId: portalFileURL
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 43
        - name: file_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: download URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  expires_in:
                    type: string
        "404": { $ref: "#/components/responses/NotFound" }
  /tasks/{id}/time:
    post:
      summary: Log time on a task
      operationId: logTaskTime
      description: |
        Policies (spec section 11): positive interval, <=12h (v1 rejects
        longer - overtime flag comes with P1 approvals), ended_at not in
        the future, no more than 7 days back. Requires a user identity
        (JWT) - anonymous system actors cannot log time.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [started_at, ended_at]
              properties:
                started_at:
                  type: string
                  format: date-time
                ended_at:
                  type: string
                  format: date-time
                note:
                  type: string
                  maxLength: 500
      responses:
        "201":
          description: Logged (draft)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/time:
    post:
      summary: Log project-level time (taskless)
      operationId: logProjectTime
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [started_at, ended_at]
              properties:
                started_at:
                  type: string
                  format: date-time
                ended_at:
                  type: string
                  format: date-time
                note:
                  type: string
                  maxLength: 500
      responses:
        "201":
          description: Logged (draft)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      summary: List project time entries
      operationId: listProjectTime
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path

version: 2
updates:
  - package-ecosystem: gomod
    directories: ["apps/api", "apps/worker"]
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "apps/web"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: ["infra/docker"]
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.part }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: api
            working-directory: apps/api
          - part: worker
            working-directory: apps/worker
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openlane
          POSTGRES_PASSWORD: openlane
          POSTGRES_DB: openlane_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U openlane"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://openlane:openlane@localhost:5432/openlane_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: ${{ matrix.working-directory }}/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: ${{ matrix.working-directory }}
      - name: Test
        working-directory: ${{ matrix.working-directory }}
        run: go test -race -count=1 ./...
      - name: Portal integration test (api only)
        if: matrix.part == 'api'
        working-directory: apps/api
        env:
          TEST_DATABASE_URL: postgres://openlane_app:openlane_app@localhost:5432/openlane_test?sslmode=disable
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null
          go run github.com/pressly/goose/v3/cmd/goose@v3.22.0 -dir ../../db/migrations postgres "$DATABASE_URL" up >/dev/null
          PGPASSWORD=openlane psql -h localhost -U openlane -d openlane_test -c "ALTER ROLE openlane_app WITH PASSWORD 'openlane_app';"
          go test -tags integration -race -count=1 -run TestPortal ./internal/server/

  db:
    name: Migrations + RLS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openlane
          POSTGRES_PASSWORD: openlane
          POSTGRES_DB: openlane_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U openlane"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://openlane:openlane@localhost:5432/openlane_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Apply migrations
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@v3.22.0
          goose -dir db/migrations postgres "$DATABASE_URL" up
      - name: RLS + portal IDOR acceptance suite
        run: |
          # Suite runs as openlane_app (non-owner role: RLS applies; owners bypass it).
          PGPASSWORD=openlane psql -h localhost -U openlane -d openlane_test -v ON_ERROR_STOP=1 <<'SQL'
          ALTER ROLE openlane_app WITH PASSWORD 'openlane_app';
          INSERT INTO workspaces (id, name, slug) VALUES
            ('11111111-1111-1111-1111-111111111111', 'Acme SI', 'acme'),
            ('22222222-2222-2222-2222-222222222222', 'Beta Ltd', 'beta');
          INSERT INTO users (id, email, display_name) VALUES
            ('aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa', 'asha@acme.test', 'Asha');
          SQL
          PGPASSWORD=openlane_app psql -h localhost -U openlane_app -d openlane_test \
            -v ON_ERROR_STOP=1 -f db/test/portal_rls_suite.sql
      - name: Verify every table has workspace_id + RLS policy
        run: |
          PGPASSWORD=openlane psql -h localhost -U openlane -d openlane_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ DECLARE t record; missing text[];
          -- global tables are allowed to skip tenancy columns; everything else must have them
          BEGIN
            FOR t IN SELECT tablename FROM pg_tables WHERE schemaname='public' AND tablename NOT IN ('goose_db_version','workspaces','users') LOOP
              IF NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name=t.tablename AND column_name='workspace_id') THEN
                missing := array_append(missing, t.tablename || ': no workspace_id');
              END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_policies WHERE schemaname='public' AND tablename=t.tablename) THEN
                missing := array_append(missing, t.tablename || ': no RLS policy');
              END IF;
            END LOOP;
            IF array_length(missing,1) > 0 THEN
              RAISE EXCEPTION 'RLS check failed: %', missing;
            END IF;
          END $$;
          SQL
      - name: Migration reversibility (goose reset)
        run: |
          goose -dir db/migrations postgres "$DATABASE_URL" reset >/dev/null && \
          goose -dir db/migrations postgres "$DATABASE_URL" up >/dev/null && echo "migrations reversible: OK"

  contracts:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Validate OpenAPI 3.1
        run: |
          npx --yes @redocly/cli@latest lint packages/contracts/openapi.yaml --format stylish

  security:
    name: Security scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Resolve Go modules (go.sum for every module)
        run: |
          (cd apps/api && go mod tidy)
          (cd apps/worker && go mod tidy)
      - name: CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go, javascript-typescript
      - uses: github/codeql-action/analyze@v4

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Build
        working-directory: apps/web
        run: |
          npm install
          npm run build
